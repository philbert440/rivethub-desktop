[workspace]
resolver = "3"
members = ["crates/model", "crates/term", "crates/webview", "crates/webview-gtk", "crates/gateway", "crates/app", "crates/ui"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/philbert440/rivethub-desktop"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }
gateway = { path = "crates/gateway" }
app = { path = "crates/app" }
term = { path = "crates/term" }
webview = { path = "crates/webview" }
alacritty_terminal = "0.26.0"
parking_lot = "0.12"
pulldown-cmark = { version = "0.13", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.25.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.25.3", features = ["font-kit", "wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
wire = { git = "https://github.com/philbert440/rivethub-runtime", rev = "7641907cc4782d544f29202de71edac4925725ab" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
base64 = "0.22"
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
x509-parser = { version = "0.18", default-features = false }
cpal = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

