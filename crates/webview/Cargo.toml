[package]
name = "webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
gtk = "0.18"
javascriptcore-rs = "1.1"
soup3 = "0.5"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

# The workspace's lints, less `unsafe_code = "forbid"`: synthesizing GDK events and subclassing
# WebKit's input method context go through C, in the two modules that say so.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
