[package]
name = "webview-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The app loads this library when a web panel first opens, so it starts and runs without WebKitGTK.
[lib]
name = "rivethub_webview"
crate-type = ["cdylib"]
doctest = false

[dependencies]
futures.workspace = true
serde_json.workspace = true
webview.workspace = true
gtk = "0.18"
javascriptcore-rs = "1.1"
soup3 = "0.5"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

# The workspace's lints, less `unsafe_code = "forbid"`: the exported functions, synthesized GDK
# events and the input method subclass go through C, in the modules that say so.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
